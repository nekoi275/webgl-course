<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 - Adding points on mouse click</title>

  <style>
      
    * { margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 1.5em;
      margin-bottom: 1em;
    }

    #go-back {
      position: fixed;
      top: 1em;
      left: 1em;
    }

    #canvas {
      box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
    }

  </style>

</head>
<body>

  <a id="go-back" href="/">Go Back</a>

  <div id="container">
    <h1>04 Adding points on mouse click</h1>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const VERTEX_SHADER_SOURCE = `
        attribute vec4 position;
        attribute vec4 color;
        attribute float pointSize;

        varying vec4 v_color;

        void main () {
            gl_Position = position;
            gl_PointSize = pointSize;

            v_color = color;
        }
    `

    const FRAGMENT_SHADER_SOURCE = `
        precision highp float;
        varying vec4 v_color;

        void main () {
            gl_FragColor = v_color;
        }
    `

    const CANVAS_WIDTH = 512
    const CANVAS_HEIGHT = 512

    const canvas = document.getElementById('canvas')
    canvas.width = CANVAS_WIDTH * devicePixelRatio
    canvas.height = CANVAS_HEIGHT * devicePixelRatio
    canvas.style.setProperty('width', `${CANVAS_WIDTH}px`)
    canvas.style.setProperty('height', `${CANVAS_HEIGHT}px`)

    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl')

    const vertexShader = createShader(gl.VERTEX_SHADER, VERTEX_SHADER_SOURCE)
    const fragmentShader = createShader(gl.FRAGMENT_SHADER, FRAGMENT_SHADER_SOURCE)

    const drawingProgram = createProgram(vertexShader, fragmentShader)

    let positions = new Float32Array([
      Math.random() * 2 - 1,
      Math.random() * 2 - 1
    ])

    let colors = new Float32Array([
      1.0, 0.0, 0.0
    ])

    let pointSizes = new Float32Array([
      Math.random() * 15 +5
    ])

    const vertexBuffer = gl.createBuffer()

    const colorBuffer = gl.createBuffer()

    const sizeBuffer = gl.createBuffer()

    const positionAttributeLocationGPU = gl.getAttribLocation(drawingProgram, 'position') // 0
    const colorAttributeLocationGPU = gl.getAttribLocation(drawingProgram, 'color') // 1
    const pointSizeAttributeLocationGPU = gl.getAttribLocation(drawingProgram, 'pointSize') // 2

    canvas.addEventListener('click', onMouseClick)

    function onMouseClick(event) {
      const globalPageCoordX = event.pageX
      const globalPageCoordY = event.pageY
      const canvasBoundingBox = canvas.getBoundingClientRect()
      const localCanvasCoordX = globalPageCoordX - canvasBoundingBox.left
      const localCanvasCoordY = globalPageCoordY - canvasBoundingBox.top
      const webglNormalizedCoordX = localCanvasCoordX / canvasBoundingBox.width * 2 - 1
      const webglNormalizedCoordY = 2 - localCanvasCoordY / canvasBoundingBox.height * 2 - 1
      positions = new Float32Array([
        ...positions, webglNormalizedCoordX, webglNormalizedCoordY
      ])

      const randR = Math.random()
      const randG = Math.random()
      const randB = Math.random()
      colors = new Float32Array([
        ...colors, randR, randG, randB
      ])

      const randPointSize = Math.random() * 15 + 5
      pointSizes = new Float32Array([
        ...pointSizes, randPointSize
      ])
    }


    requestAnimationFrame(renderFrame)

    function renderFrame() {
      requestAnimationFrame(renderFrame)

      gl.viewport(0,0, gl.drawingBufferWidth, gl.drawingBufferHeight)
      gl.clearColor(0,0,0,1)
      gl.clear(gl.COLOR_BUFFER_BIT)
      
      {
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer)
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.DYNAMIC_DRAW)
        gl.enableVertexAttribArray(positionAttributeLocationGPU)
        gl.vertexAttribPointer(positionAttributeLocationGPU, 2, gl.FLOAT, false, 0, 0)
      }

      {
        gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer)
        gl.bufferData(gl.ARRAY_BUFFER, colors, gl.DYNAMIC_DRAW)
        gl.enableVertexAttribArray(colorAttributeLocationGPU)
        gl.vertexAttribPointer(colorAttributeLocationGPU, 3, gl.FLOAT, false, 0, 0)
      }

      {
        gl.bindBuffer(gl.ARRAY_BUFFER, sizeBuffer)
        gl.bufferData(gl.ARRAY_BUFFER, pointSizes, gl.DYNAMIC_DRAW)
        gl.enableVertexAttribArray(pointSizeAttributeLocationGPU)
        gl.vertexAttribPointer(pointSizeAttributeLocationGPU, 1, gl.FLOAT, false, 0, 0)
      }

      gl.useProgram(drawingProgram)

      gl.drawArrays(gl.POINTS, 0, positions.length / 2)
    }

    function createShader(type, source) {
        const shader = gl.createShader(type)
        gl.shaderSource(shader, source)
        gl.compileShader(shader)

        if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            return shader
        }

        console.error(`Shader compilation error: ${gl.getShaderInfoLog(shader)}`)

        gl.deleteShader(shader)
    }
    function createProgram(vertextShaderObject, fragmentShaderObject) {
        const program = gl.createProgram()
        gl.attachShader(program, vertextShaderObject)
        gl.attachShader(program, fragmentShaderObject)
        gl.linkProgram(program)

        if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
            return program
        }

        console.error(`Program linking error: ${gl.getProgramInfoLog(program)}`)

        gl.deleteProgram(program)
    }


  </script>

</body>
</html>
