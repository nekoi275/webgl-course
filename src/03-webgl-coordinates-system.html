<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03 - WebGl coordinates system</title>

  <style>
      
    * { margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 1.5em;
      margin-bottom: 1em;
    }

    #go-back {
      position: fixed;
      top: 1em;
      left: 1em;
    }

    #canvas {
      box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
    }

  </style>

</head>
<body>

  <a id="go-back" href="/">Go Back</a>

  <div id="container">
    <h1>03 WebGl coordinates system</h1>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const VERTEX_SHADER_SOURCE = `
        attribute vec4 position;

        void main () {
            gl_Position = position;
            gl_PointSize = 20.0;
        }
    `

    const FRAGMENT_SHADER_SOURCE = `
        void main () {
            gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
        }
    `
    const CANVAS_WIDTH = 512
    const CANVAS_HEIGHT = 512

    const canvas = document.getElementById('canvas')
    canvas.width = CANVAS_WIDTH * devicePixelRatio
    canvas.height = CANVAS_HEIGHT * devicePixelRatio
    canvas.style.setProperty('width', `${CANVAS_WIDTH}px`)
    canvas.style.setProperty('height', `${CANVAS_HEIGHT}px`)

    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl')
    
    const vertexShader = createShader(gl.VERTEX_SHADER, VERTEX_SHADER_SOURCE)
    const fragmentShader = createShader(gl.FRAGMENT_SHADER, FRAGMENT_SHADER_SOURCE)

    const drawingProgram = createProgram(vertexShader, fragmentShader)

    const positions = new Float32Array([
      Math.random() * 2 - 1,
      Math.random() * 2 - 1
    ])

    const vertexBuffer = gl.createBuffer()

    const positionAttributeLocationGPU = gl.getAttribLocation(drawingProgram, 'position')


    requestAnimationFrame(renderFrame)

    function renderFrame() {
        requestAnimationFrame(renderFrame)

        gl.viewport(0,0, gl.drawingBufferWidth, gl.drawingBufferHeight)
        gl.clearColor(0,0,0,1)
        gl.clear(gl.COLOR_BUFFER_BIT)

        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer)
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW)

        gl.enableVertexAttribArray(positionAttributeLocationGPU)

        gl.vertexAttribPointer(positionAttributeLocationGPU, 2, gl.FLOAT, false, 0, 0)

        gl.useProgram(drawingProgram)

        gl.drawArrays(gl.POINTS, 0, 1)
    }

    function createShader(type, source) {
        const shader = gl.createShader(type)
        gl.shaderSource(shader, source)
        gl.compileShader(shader)

        if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            return shader
        }

        console.error(`Shader compilation error: ${gl.getShaderInfoLog(shader)}`)

        gl.deleteShader(shader)
    }
    function createProgram(vertextShaderObject, fragmentShaderObject) {
        const program = gl.createProgram()
        gl.attachShader(program, vertextShaderObject)
        gl.attachShader(program, fragmentShaderObject)
        gl.linkProgram(program)

        if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
            return program
        }

        console.error(`Program linking error: ${gl.getProgramInfoLog(program)}`)

        gl.deleteProgram(program)
    }


  </script>

</body>
</html>
